<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Wheel Beauty System - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .demo-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .color-input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .color-input {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .color-input label {
            font-weight: 600;
            color: #555;
            font-size: 0.9em;
        }

        .color-picker-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="color"] {
            width: 60px;
            height: 60px;
            border: 3px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        input[type="color"]:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .rgb-values {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #666;
            background: #f5f5f5;
            padding: 8px;
            border-radius: 5px;
            flex: 1;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .results h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .color-info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
        }

        .color-info h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .color-swatch {
            display: inline-block;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            border: 3px solid #ddd;
            margin-right: 15px;
            vertical-align: middle;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .info-item {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .info-label {
            font-weight: 600;
            color: #555;
        }

        .info-value {
            color: #667eea;
            font-weight: 600;
        }

        .harmony-result {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .harmony-type {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .harmony-score {
            font-size: 2.5em;
            font-weight: 700;
            margin: 10px 0;
        }

        .traits-list {
            list-style: none;
            padding: 0;
        }

        .traits-list li {
            background: white;
            color: #333;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            font-size: 0.95em;
        }

        .example-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .example-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 10px 20px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .color-input-group {
                grid-template-columns: 1fr;
            }

            .example-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Color Wheel Beauty System</h1>
        <p class="subtitle">Traditional RYB Color Wheel for ChromaWing Genetics</p>

        <!-- Single Color Analysis -->
        <div class="demo-section">
            <h2>🔍 Single Color Analysis</h2>
            <div class="color-input-group">
                <div class="color-input">
                    <label>Pick a Color:</label>
                    <div class="color-picker-container">
                        <input type="color" id="singleColor" value="#FF0000">
                        <div class="rgb-values" id="singleRgb">RGB: 255, 0, 0</div>
                    </div>
                </div>
            </div>
            <button onclick="analyzeSingleColor()">Analyze Color</button>
            <div id="singleResults"></div>
        </div>

        <!-- Harmony Detection -->
        <div class="demo-section">
            <h2>🎭 Color Harmony Detection</h2>

            <div class="example-buttons">
                <button class="example-btn" onclick="loadExample('complementary')">Red & Green (Complementary)</button>
                <button class="example-btn" onclick="loadExample('triadic')">Red-Yellow-Blue (Triadic)</button>
                <button class="example-btn" onclick="loadExample('analogous')">Red-Orange-Yellow (Analogous)</button>
                <button class="example-btn" onclick="loadExample('monochromatic')">Red Shades (Monochromatic)</button>
            </div>

            <div class="color-input-group">
                <div class="color-input">
                    <label>Color 1:</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#FF0000">
                        <div class="rgb-values" id="rgb1">RGB: 255, 0, 0</div>
                    </div>
                </div>
                <div class="color-input">
                    <label>Color 2:</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#00FF00">
                        <div class="rgb-values" id="rgb2">RGB: 0, 255, 0</div>
                    </div>
                </div>
                <div class="color-input">
                    <label>Color 3:</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#0000FF">
                        <div class="rgb-values" id="rgb3">RGB: 0, 0, 255</div>
                    </div>
                </div>
                <div class="color-input">
                    <label>Color 4:</label>
                    <div class="color-picker-container">
                        <input type="color" id="color4" value="#FFFF00">
                        <div class="rgb-values" id="rgb4">RGB: 255, 255, 0</div>
                    </div>
                </div>
                <div class="color-input">
                    <label>Color 5:</label>
                    <div class="color-picker-container">
                        <input type="color" id="color5" value="#FF00FF">
                        <div class="rgb-values" id="rgb5">RGB: 255, 0, 255</div>
                    </div>
                </div>
                <div class="color-input">
                    <label>Color 6:</label>
                    <div class="color-picker-container">
                        <input type="color" id="color6" value="#00FFFF">
                        <div class="rgb-values" id="rgb6">RGB: 0, 255, 255</div>
                    </div>
                </div>
            </div>

            <button onclick="analyzeHarmony()">Detect Harmony & Calculate Beauty Score</button>
            <div id="harmonyResults"></div>
        </div>
    </div>

    <script type="module">
        import * as ColorWheel from './js/lib/colorWheel.js';

        // Make functions available globally
        window.ColorWheel = ColorWheel;

        // Update RGB values when color changes
        function setupColorInputs() {
            const inputs = ['singleColor', 'color1', 'color2', 'color3', 'color4', 'color5', 'color6'];
            inputs.forEach(id => {
                const input = document.getElementById(id);
                const displayId = id === 'singleColor' ? 'singleRgb' : id.replace('color', 'rgb');

                input.addEventListener('input', () => {
                    const color = input.value;
                    const r = parseInt(color.substr(1, 2), 16);
                    const g = parseInt(color.substr(3, 2), 16);
                    const b = parseInt(color.substr(5, 2), 16);
                    document.getElementById(displayId).textContent = `RGB: ${r}, ${g}, ${b}`;
                });
            });
        }

        setupColorInputs();

        // Analyze single color
        window.analyzeSingleColor = function() {
            const color = document.getElementById('singleColor').value;
            const r = parseInt(color.substr(1, 2), 16);
            const g = parseInt(color.substr(3, 2), 16);
            const b = parseInt(color.substr(5, 2), 16);

            const hsv = ColorWheel.rgbToRYBWheel(r, g, b);
            const classification = ColorWheel.classifyColor(hsv.hue, hsv.saturation, hsv.value);
            const complementHue = ColorWheel.getComplementaryHue(hsv.hue);
            const complementName = ColorWheel.getColorName(complementHue);

            const html = `
                <div class="results">
                    <h3>Color Analysis Results</h3>
                    <div class="color-info">
                        <span class="color-swatch" style="background: rgb(${r}, ${g}, ${b})"></span>
                        <h4>RGB(${r}, ${g}, ${b})</h4>
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">RYB Hue:</span>
                                <span class="info-value">${hsv.hue.toFixed(1)}°</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Saturation:</span>
                                <span class="info-value">${(hsv.saturation * 100).toFixed(1)}%</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Value:</span>
                                <span class="info-value">${(hsv.value * 100).toFixed(1)}%</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Category:</span>
                                <span class="info-value">${classification.category}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Color Name:</span>
                                <span class="info-value">${classification.name}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Beauty Value:</span>
                                <span class="info-value">${classification.beautyValue} points</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Complement:</span>
                                <span class="info-value">${complementName} (${complementHue.toFixed(1)}°)</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('singleResults').innerHTML = html;
        };

        // Analyze harmony
        window.analyzeHarmony = function() {
            const colors = [];

            for (let i = 1; i <= 6; i++) {
                const color = document.getElementById(`color${i}`).value;
                const r = parseInt(color.substr(1, 2), 16);
                const g = parseInt(color.substr(3, 2), 16);
                const b = parseInt(color.substr(5, 2), 16);

                const hsv = ColorWheel.rgbToRYBWheel(r, g, b);
                const classification = ColorWheel.classifyColor(hsv.hue, hsv.saturation, hsv.value);

                colors.push({
                    rgb: { r, g, b },
                    hue: hsv.hue,
                    saturation: hsv.saturation,
                    value: hsv.value,
                    category: classification.category,
                    name: classification.name,
                    beautyValue: classification.beautyValue
                });
            }

            // Calculate beauty score
            let totalScore = 0;
            const allTraits = [];

            // Individual colors
            const colorScores = colors.map(c => c.beautyValue);
            const colorSum = colorScores.reduce((sum, s) => sum + s, 0);
            totalScore += colorSum;
            colors.forEach((c, i) => {
                if (c.beautyValue > 0) {
                    allTraits.push(`${c.category} ${c.name}: Color ${i+1} (+${c.beautyValue})`);
                }
            });

            // Harmony
            const harmony = ColorWheel.detectHarmony(colors);
            totalScore += harmony.score;
            allTraits.push(...harmony.traits);

            // Saturation coherence
            const saturations = colors.map(c => c.saturation);
            const satScore = ColorWheel.scoreSaturationCoherence(saturations);
            totalScore += satScore.score;
            allTraits.push(...satScore.traits);

            // Value contrast
            const values = colors.map(c => c.value);
            const valueScore = ColorWheel.scoreValueContrast(values);
            totalScore += valueScore.score;
            allTraits.push(...valueScore.traits);

            // Pure color bonus
            let pureBonus = 0;
            colors.forEach((c, i) => {
                if (c.saturation > 0.7 && c.value > 0.7) {
                    pureBonus += 8;
                    allTraits.push(`Vivid color: Color ${i+1} (+8)`);
                }
            });
            totalScore += pureBonus;

            // Display results
            let html = `
                <div class="results">
                    <div class="harmony-result">
                        <div class="harmony-type">${harmony.type || 'No Harmony Detected'}</div>
                        <div class="harmony-score">${totalScore} / 300 Points</div>
                    </div>

                    <h3>Color Palette</h3>
            `;

            colors.forEach((c, i) => {
                html += `
                    <div class="color-info">
                        <span class="color-swatch" style="background: rgb(${c.rgb.r}, ${c.rgb.g}, ${c.rgb.b})"></span>
                        <h4>Color ${i+1}: ${c.name} (${c.beautyValue} pts)</h4>
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">RYB Hue:</span>
                                <span class="info-value">${c.hue.toFixed(1)}°</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Saturation:</span>
                                <span class="info-value">${(c.saturation * 100).toFixed(1)}%</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Value:</span>
                                <span class="info-value">${(c.value * 100).toFixed(1)}%</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Category:</span>
                                <span class="info-value">${c.category}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                    <h3>Beauty Breakdown</h3>
                    <ul class="traits-list">
            `;

            allTraits.forEach(trait => {
                html += `<li>${trait}</li>`;
            });

            html += `
                    </ul>
                </div>
            `;

            document.getElementById('harmonyResults').innerHTML = html;
        };

        // Load example color schemes
        window.loadExample = function(type) {
            const examples = {
                complementary: ['#FF0000', '#00FF00', '#FF0000', '#00FF00', '#FF0000', '#00FF00'],
                triadic: ['#FF0000', '#FFFF00', '#0000FF', '#FF0000', '#FFFF00', '#0000FF'],
                analogous: ['#FF0000', '#FF8800', '#FFFF00', '#FF0000', '#FF8800', '#FFFF00'],
                monochromatic: ['#8B0000', '#FF0000', '#FF6666', '#8B0000', '#FF0000', '#FF6666']
            };

            const colors = examples[type];
            if (colors) {
                colors.forEach((color, i) => {
                    const input = document.getElementById(`color${i+1}`);
                    input.value = color;
                    input.dispatchEvent(new Event('input'));
                });
            }
        };
    </script>
</body>
</html>
