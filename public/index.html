<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful SVG Flower</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #c9184a;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            font-style: italic;
        }

        .flower-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .flower-container svg {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
        }

        .description {
            color: #555;
            line-height: 1.6;
            margin-top: 20px;
            font-size: 1em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Beautiful Flower</h1>
        <p class="subtitle">Created with SVG & Love</p>

        <div class="flower-container">
            <object data="flower.svg" type="image/svg+xml">
                <img src="flower.svg" alt="Beautiful SVG Flower">
            </object>
        </div>

        <p class="description">
            This beautiful flower is created entirely with SVG (Scalable Vector Graphics).
            It features vibrant pink petals with gradients, a golden center,
            and green leaves with subtle animations.
        </p>
    </div>
</body>
</html>
